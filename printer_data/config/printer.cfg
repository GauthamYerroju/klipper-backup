# =================================================================================
# Manta M8P V2.0: STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)", "CAN bus (on PD0/PD1)" or Serial (on USART1 PA10/PA9).
# 
# BIGTREETECH EBB36 v1.2: STM32G0B1 with "8 MHz crystal" and
# "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# =================================================================================

[include fluidd.cfg]
[include klicky-probe.cfg]
[include KAMP_Settings.cfg]
[include macros.cfg]
[include calibrate_pa.cfg]

[mcu]
canbus_uuid: 51c764633678
[mcu EBBCan]
canbus_uuid: 21c02c6afb53

[exclude_object]
[gcode_arcs]
resolution: 0.1

[printer]
kinematics: corexy
# AUTO SPEED found recommended acceleration and velocity after 246.23s
# | DIAG X max: a15030 v333
# | DIAG Y max: a17094 v364
# Recommended accel: 15030
# Recommended velocity: 333
max_velocity: 250 # 364 # Use max here, limit per-axis in slicer profile
max_accel: 10000 # 17094 # Use max here, limit per-axis in slicer profile
max_z_velocity: 20
max_z_accel: 750
# square_corner_velocity: 10.0

[adxl345]
cs_pin: EBBCan: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[extruder]
dir_pin: !EBBCan: PD1
step_pin: EBBCan: PD0
enable_pin: !EBBCan: PD2
microsteps: 32
rotation_distance: 4.48565
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan: PA3
control: pid
pid_Kp: 32.911
pid_Ki: 10.971
pid_Kd: 24.683

min_temp: 0
max_temp: 280

# max_power: 1.0
# min_extrude_temp: 1
max_extrude_cross_section: 5
max_extrude_only_distance: 450.0

pressure_advance: 0.0275
pressure_advance_smooth_time: 0.040
 
[fan]
pin: EBBCan: PA0

[heater_fan hotend_fan]
pin: EBBCan: PA1
heater: extruder
heater_temp: 50.0

[probe]
pin: EBBCan: PB9
x_offset: 0
y_offset: 19.75
z_offset: 6.245 # 6.42
speed: 10
samples:3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.01
samples_tolerance_retries: 3

[bed_mesh]
speed: 200
horizontal_move_z: 25
mesh_min: 20, 20
mesh_max: 154, 135
probe_count: 5, 5

[quad_gantry_level]
# https://github.com/PrintersForAnts/Micron/blob/main/Firmware/printer_data/config/printer.cfg
gantry_corners:
  -37, 0
  225, 237.5
points:
 13,1
 13,140
 160,140
 160,1
speed: 200
horizontal_move_z: 25 # Has to be greater than z_offset. For Klicky, this is fixed to 6.something.
max_adjust: 10
retries: 3
retry_tolerance: 0.025 # 0.0075

[resonance_tester]
probe_points:
  87,85,25
accel_chip: adxl345
hz_per_sec: 2 # Default of 1 causes "Timer too close" error on CB1.

[shaketune]

[input_shaper]
shaper_freq_x: 77.8
shaper_type_x: mzv
damping_ratio_x: 0.048
shaper_freq_y: 54.6
shaper_type_y: mzv
damping_ratio_y: 0.039


# =========================================
# Motors:
#  - XY axes:  Stepperonline 17HE15-1504S
#  - Z axis:   Moons MS14HS5P4150-11
#  - Extruder: Moons CSE14HRA1L410A-01
# =========================================

[stepper_x]
dir_pin: PE5
step_pin: PE6
enable_pin: !PC14
endstop_pin: EBBCan: PB6
microsteps: 32
rotation_distance: 32
position_endstop: 174
position_min: 0
position_max: 174
homing_speed: 50

[stepper_y]
dir_pin: PE1
step_pin: PE2
enable_pin: !PE4
endstop_pin: ^PF4
microsteps: 32
rotation_distance: 32
position_endstop: 187
position_min: 0
position_max: 187
homing_speed: 50

[stepper_z]
dir_pin: PG12
step_pin: PG13
enable_pin: !PG15
endstop_pin: probe:z_virtual_endstop
microsteps: 32
rotation_distance: 32
gear_ratio: 64:16
position_min: -5.0
position_max: 160
homing_speed: 12
second_homing_speed: 6
homing_retract_dist: 2

[stepper_z1]
dir_pin: !PB7
step_pin: PB8
enable_pin: !PE0
microsteps: 32
rotation_distance: 32
gear_ratio: 64:16

[stepper_z2]
dir_pin: PB3
step_pin: PB4
enable_pin: !PB6
microsteps: 32
rotation_distance: 32
gear_ratio: 64:16

[stepper_z3]
dir_pin: !PD7
step_pin: PG9
enable_pin: !PG11
microsteps: 32
rotation_distance: 32
gear_ratio: 64:16

[heater_bed]
heater_pin: PA1
sensor_pin: PB1
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 130
control = pid
pid_kp = 51.138
pid_ki = 1.188
pid_kd = 550.377

[temperature_sensor chamber_temp]
sensor_type: Generic 3950
sensor_pin: PB0
min_temp: 0
max_temp: 100
gcode_id: chamber_thermistor

[fan_generic Right-Fan_(4020_Winsinn)]
pin: PF7

[temperature_fan Right-Fan_(4010_GDSTime)]
pin: PF9
sensor_type: temperature_host
control: watermark
target_temp: 55
min_temp: 10
max_temp: 70
kick_start_time: 0.5
off_below: 0.15

[fan_generic Left-Fan_(4010_GDSTime)]
pin: PF6

[temperature_fan Pi-Fan_(4020_Winsinn)]
pin: PF8
sensor_type: temperature_host
control: watermark
target_temp: 55
min_temp: 10
max_temp: 70
kick_start_time: 0.5
off_below: 0.15

########################################
# TMC2209 configuration
########################################
[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PE3
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PB9
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: PB5
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_z2]
uart_pin: PG14
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 stepper_z3]
uart_pin: PG10
run_current: 0.800
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.650
stealthchop_threshold: 999999

[autotune_tmc stepper_x]
motor: moons-ms14hs5p4150
tuning_goal: silent
[autotune_tmc stepper_y]
motor: moons-ms14hs5p4150
tuning_goal: silent

[autotune_tmc stepper_z]
motor: omc-17he15-1504s
tuning_goal: silent

[autotune_tmc stepper_z1]
motor: omc-17he15-1504s
tuning_goal: silent

[autotune_tmc stepper_z2]
motor: omc-17he15-1504s
tuning_goal: silent

[autotune_tmc stepper_z3]
motor: omc-17he15-1504s
tuning_goal: silent

[autotune_tmc extruder]
motor: moons-cse14hra1l410a
tuning_goal: silent


# ==================================================================
[auto_speed]
results_dir: ~/printer_data/config/autotune

# ==================================================================
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,
    
    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

