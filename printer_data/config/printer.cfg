# =================================================================================
# This file contains common pin mappings for the BIGTREETECH Manta M8P V2.0
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)", "CAN bus (on PD0/PD1)" or Serial (on USART1 PA10/PA9).

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_2E0003000751313339373836-if00

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[exclude_object]

[gcode_arcs]
resolution: 0.1

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 50
max_z_accel: 350
# square_corner_velocity: 10.0

# =========================================
# Extruder
# =========================================

# [extruder]
# step_pin: EBBCan: PD0
# dir_pin: EBBCan: PD1
# enable_pin: !EBBCan: PD2
# microsteps:16
# gear_ratio: 9:1
# rotation_distance: 47.088
# nozzle_diameter: 0.400
# filament_diameter: 1.750
# heater_pin: EBBCan: PB13
# sensor_type: ATC Semitec 104NT-4-R025H42G
# sensor_pin: EBBCan: PA3
# control: pid
# min_temp: 0
# max_temp: 305
# max_power: 1.0
# min_extrude_temp: 1
# max_extrude_cross_section: 5
# max_extrude_only_distance: 450.0
# control = pid
# pid_kp = 26.213
# pid_ki = 1.304
# pid_kd = 131.721
# ##  Try to keep pressure_advance below 1.0
# pressure_advance: 0.045
# ##  Default is 0.040, leave stock
# pressure_advance_smooth_time: 0.040

# # sensor_type:MAX31865
# # sensor_pin: EBBCan: PA4
# # spi_bus: spi1
# # rtd_nominal_r: 100
# # rtd_reference_r: 430
# # rtd_num_of_wires: 2

# [tmc2209 extruder]
# uart_pin: EBBCan: PA15
# run_current: 0.6
# stealthchop_threshold: 0

# =========================================
# Motors:
#  - XY axes:  Stepperonline 17HE15-1504S
#  - Z axis:   Moons MS14HS5P4150-11
#  - Extruder: Moons CSE14HRA1L410A-01
# =========================================

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF4
position_endstop: 0
position_max: 180
homing_speed: 50

[stepper_y]
dir_pin: PE1
step_pin: PE2
enable_pin: !PE4
endstop_pin: ^PF3
microsteps: 16
rotation_distance: 40
position_endstop: 0
position_max: 180
homing_speed: 50

[stepper_z1]
dir_pin: !PB7
step_pin: PB8
enable_pin: !PE0
# endstop_pin: ^PF2
microsteps: 16
rotation_distance: 8
position_endstop: 0
position_max: 180
position_min: -5.0
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z2]
dir_pin: PB3
step_pin: PB4
enable_pin: !PB6
# endstop_pin: ^PF1
microsteps: 16
rotation_distance: 8
position_endstop: 0
position_max: 180
position_min: -5.0
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z3]
dir_pin: PG12
step_pin: PG13
enable_pin: !PG15
# endstop_pin: ^PF1
microsteps: 16
rotation_distance: 8
position_endstop: 0
position_max: 180
position_min: -5.0
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z4]
dir_pin: PG12
step_pin: PG13
enable_pin: !PG15
# endstop_pin: ^PF1
microsteps: 16
rotation_distance: 8
position_endstop: 0
position_max: 180
position_min: -5.0
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[heater_bed]
heater_pin: PF5
sensor_pin: PB1 # TB 
sensor_type: ATC Semitec 104GT-2
control: watermark
min_temp: 0
max_temp: 130

#[fan_generic soc-fan]
#pin: host:gpio79  #CB1
#pin: host:gpio26  #CM4

# Fan0
[fan]
pin: PF7

