# =================================================================================
# This file contains common pin mappings for the BIGTREETECH Manta M8P V2.0
# To use this config, the firmware should be compiled for the
# STM32H723 with a "128KiB bootloader" "25 MHz crystal"
# and "USB (on PA11/PA12)", "CAN bus (on PD0/PD1)" or Serial (on USART1 PA10/PA9).

[include fluidd.cfg]
[include printer-toolhead.cfg]

# ==================================================================
# MACROS
# ==================================================================
[include klicky-probe.cfg]


[mcu]
canbus_uuid: 51c764633678

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[exclude_object]

[display_status]

[pause_resume]

[gcode_arcs]
resolution: 0.1

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 50
max_z_accel: 350
# square_corner_velocity: 10.0

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 5, 40
mesh_max: 120, 120
probe_count: 5, 5

[quad_gantry_level]
# https://github.com/PrintersForAnts/Micron/blob/main/Firmware/printer_data/config/printer.cfg
gantry_corners:
  -60.2,-10.4
  244.1,234.5
# Probe points
points:
 13,1
 13,140
 160,140
 160,1
# speed: 50
# horizontal_move_z: 5
# max_adjust: 4
# retries: 0
# retry_tolerance: 0

# =========================================
# Motors:
#  - XY axes:  Stepperonline 17HE15-1504S
#  - Z axis:   Moons MS14HS5P4150-11
#  - Extruder: Moons CSE14HRA1L410A-01
# =========================================

[stepper_x]
dir_pin: PE5
step_pin: PE6
enable_pin: !PC14
# endstop_pin: ^PF3 # Connected to CAN bus, defined in toolhead.cfg
microsteps: 16
rotation_distance: 40
position_endstop: 217
position_min: 0
position_max: 216 # 1 mm less than end stop
homing_speed: 50

[stepper_y]
dir_pin: PE1
step_pin: PE2
enable_pin: !PE4
endstop_pin: ^PF4
microsteps: 16
rotation_distance: 40
position_endstop: 180
position_min: -100
position_max: 232
homing_speed: 50

[stepper_z]
dir_pin: PG12
step_pin: PG13
enable_pin: !PG15
endstop_pin: probe:z_virtual_endstop
microsteps: 16
rotation_distance: 8
# position_endstop: 0
position_min: -5.0
position_max: 180
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z1]
dir_pin: !PB7
step_pin: PB8
enable_pin: !PE0
microsteps: 16
rotation_distance: 8

[stepper_z2]
dir_pin: PB3
step_pin: PB4
enable_pin: !PB6
microsteps: 16
rotation_distance: 8

[stepper_z3]
dir_pin: !PD7
step_pin: PG9
enable_pin: !PG11
microsteps: 16
rotation_distance: 8


[heater_bed]
heater_pin: PA1
sensor_pin: PB1 # TB 
sensor_type: EPCOS 100K B57560G104F
control: watermark
min_temp: 0
max_temp: 130

# Fan0
[fan_generic Right-Fan_(4020_Winsinn)]
pin: PF7

# Fan1
[temperature_fan Right-Fan_(4010_GDSTime)]
pin: PF9
sensor_type: temperature_host
control: watermark
target_temp: 50
min_temp: 10
max_temp: 60
kick_start_time: 0.5
off_below: 0.15

# Fan2
[fan_generic Left-Fan_(4010_GDSTime)]
pin: PF6

# Fan3
[temperature_fan Pi-Fan_(4020_Winsinn)]
pin: PF8
sensor_type: temperature_host
control: watermark
target_temp: 50
min_temp: 10
max_temp: 60
kick_start_time: 0.5
off_below: 0.15

## Fan4
#[heater_fan fan4]
#pin: PA4

## Fan5
#[heater_fan fan5]
#pin: PA6
#tachometer_pin: PC2

## Fan6
#[heater_fan fan6]
#pin: PA2
#tachometer_pin: PC1

########################################
# TMC2209 configuration
########################################

# Motor1
[tmc2209 stepper_x]
uart_pin: PC13
#diag_pin: PF4
run_current: 0.800
stealthchop_threshold: 999999

# Motor2
[tmc2209 stepper_y]
uart_pin: PE3
#diag_pin: PF3
run_current: 0.800
stealthchop_threshold: 999999

# Motor3
[tmc2209 stepper_z]
uart_pin: PB9
#diag_pin: PF2
run_current: 0.650
stealthchop_threshold: 999999

# Motor4
[tmc2209 stepper_z1]
uart_pin: PB5
#diag_pin: PF1
run_current: 0.650
stealthchop_threshold: 999999

# Motor5
[tmc2209 stepper_z2]
uart_pin: PG14
run_current: 0.800
stealthchop_threshold: 999999

# Motor6
[tmc2209 stepper_z3]
uart_pin: PG10
run_current: 0.800
stealthchop_threshold: 999999

# # Motor7
# [tmc2209 extruder2]
# uart_pin: PD5
# run_current: 0.800
# stealthchop_threshold: 999999

# # Motor8
# [tmc2209 extruder3]
# uart_pin: PC6
# run_current: 0.800
# stealthchop_threshold: 999999

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,
    
    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>
