
[gcode_macro PRINT_START]
gcode:
    [gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}

    G90                                ; absolute coordinates
    M83                                ; relative extruder mode
    SET_GCODE_OFFSET Z=0.0             ; reset Z offset

    M140 S{BED_TEMP}                   ; start bed heating
    M104 S150                          ; preheat nozzle to reduce oozing
    G4 S10

    G28                                ; home all axes

    G1 Z50 F2400                       ; raise nozzle
    G1 X2 Y10 F3000                    ; move to purge start position

    M104 S{EXTRUDER_TEMP}              ; set final nozzle temp

    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder   MINIMUM={EXTRUDER_TEMP}

    G1 Z0.28 F240                      ; move to purge height
    G92 E0

    G1 Y140 E10 F1500                  ; first purge line
    G1 X2.3 F5000                      ; shift slightly
    G92 E0
    G1 Y10 E10 F1200                   ; second purge line
    G92 E0

[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set max_z = th.axis_maximum.z|float %}
    {% set max_y = th.axis_maximum.y|float %}
    {% set current_z = th.position.z|float %}

    M400                               ; wait for all moves to finish
    G92 E0                             ; zero extruder position

    G91                                ; relative positioning
    G1 E-3 F1800                       ; retract filament
    G1 Z2 F600                         ; lift 2 mm
    G90                                ; absolute positioning

    ; Present print
    G1 X5 Y{max_y * 0.8} F6000

    ; Raise further, limited by printer height
    {% if current_z < max_z - 10 %}
        G1 Z{[current_z + 70, max_z - 10]|min} F600
    {% endif %}

    ; Ensure nozzle is at least 60% of build height
    {% if current_z < max_z * 0.6 %}
        G1 Z{max_z * 0.6} F600
    {% endif %}

    ; Shut down heaters and fan
    M106 S0                            ; part cooling fan off
    M104 S0                            ; hotend off
    M140 S0                            ; bed off

    ; Disable selected steppers, keep Z energized to hold position
    M84 X Y E