# Ellis's Useful Macros

[gcode_macro _CQGL]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        {% if "xyz" not in printer.toolhead.homed_axes %}
            G28 ; home if not already homed
        {% endif %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}



#####################################################################
#   A better print_start macro for v2/trident
#####################################################################

## *** THINGS TO UNCOMMENT: ***
## Bed mesh (2 lines at 2 locations)
## Nevermore (if you have one)
## Z_TILT_ADJUST (For Trident only)
## QUAD_GANTRY_LEVEL (For V2.4 only)
## Beacon Contact logic (if you have one. 4 lines at 4 locations)

[delayed_gcode _turn_off_chamber_fans]
initial_duration: 0
gcode:
    {% if printer["temperature_sensor chamber_temp"].temperature <= 30 %}
        SET_DISPLAY_TEXT MSG="Turning off bed fans and carbon filter."
        SET_FAN_SPEED FAN=Carbon_Filter SPEED=0
        # SET_FAN_SPEED FAN=heatbed_fan SPEED=0
    {% else %}
        SET_DISPLAY_TEXT MSG="Waiting for chamber to cool down. Current: {printer["temperature_sensor chamber_temp"]}, Target: 30"
        UPDATE_DELAYED_GCODE ID=_turn_off_chamber_fans DURATION=60
    {% endif %}

[delayed_gcode _gradual_cooldown]
initial_duration: 0
gcode:
    {% if printer.heater_bed.target > 40 %}
        M118 reduce temp to ({printer.heater_bed.target - 5 }C°).
        M140 S{ printer.heater_bed.target - 5 }
        UPDATE_DELAYED_GCODE ID=_gradual_cooldown DURATION=300
    {% else %}
        M118 Gradual bed cooling finished ({printer.heater_bed.temperature}C°).
    	M140 S0 ; turn off bed
        M118 Print Complete!
    {% endif %}

[gcode_macro turn_off_fans_after_chamber_cools]
gcode:
    UPDATE_DELAYED_GCODE ID=_turn_off_chamber_fans DURATION=1

[gcode_macro gradually_cool_down_bed]
gcode:
    UPDATE_DELAYED_GCODE ID=_gradual_cooldown DURATION=1

[gcode_macro SCRUB_NOZZLE]
gcode:
    G0 X85 Y185 Z5 F10000
    G0 X115
    G0 X85 Z4.5
    G0 X115
    G0 X85
    G0 X115
    G0 X85
    G0 X100 Z4

[gcode_macro PRINT_START]
gcode:
    # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set target_chamber = params.CHAMBER|default("45")|int %}
    # {% set target_chamber = 50|int %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

    # Clear any lingering pause states
    CLEAR_PAUSE

    # Home the printer, set absolute positioning and update the Stealthburner LEDs.
    G28 X Y                                               # Home X and Y
    ATTACH_PROBE_LOCK
    G28 Z                                                 # Home Z
    G90                                                   # Absolute position

    # Uncomment for bed mesh (1 of 2 for bed mesh)
    BED_MESH_CLEAR                                        # Clear old saved bed mesh (if any)

    # Check if the bed temp is higher than 90c - if so then trigger a heatsoak.
    {% if params.BED|int > 90 %}
        SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
        M106 S255                                           # Turn on the PT-fan
        G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
        SET_FAN_SPEED FAN=Carbon_Filter SPEED=1
        SET_FAN_SPEED FAN=heatbed_fan SPEED=1

        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target_bed}
        SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"  # Display info on display
    # If the bed temp is not over 90c, then skip the heatsoak and just heat up to set temp with a 5 min soak
    {% else %}
        SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
        G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed

        SET_FAN_SPEED FAN=Carbon_Filter SPEED=1
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target_bed}
    {% endif %}

    # Heat hotend to 150c. This helps with getting a correct Z-home.
    SET_DISPLAY_TEXT MSG="Hotend: 150c"                   # Display info on display
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM=150
    TEMPERATURE_WAIT SENSOR="heater_bed" MINIMUM={target_bed}
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={target_chamber}

    ## Uncomment for V2.4 (Quad gantry level AKA QGL)
    SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
    # QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
    # G28 Z                                                # Home Z again after QGL
    _CQGL # Conditional QGL + Z home

    SET_DISPLAY_TEXT MSG="Calibrate Auto-Z"
    CALIBRATE_Z
    
    ## Uncomment for bed mesh (2 of 2 for bed mesh)
    SET_DISPLAY_TEXT MSG="Bed mesh"                      # Display info on display
    BED_MESH_CALIBRATE ADAPTIVE=1                        # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh, disable if using auto Z calibrate

    # BED_MESH_PROFILE LOAD=hires

    # Heat up the hotend up to target via data from slicer
    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
    G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
    M107                                                  # Turn off partcooling fan
    # M109 S{target_extruder}                               # Heat the hotend to set temp
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target_extruder}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={target_extruder}

    DOCK_PROBE_UNLOCK

    # Get ready to print by doing a primeline and updating the LEDs
    SET_DISPLAY_TEXT MSG="Printer goes brr"               # Display info on display
    G90                                                   # Absolute position
    G0 X0.5 Y0.5 Z0.4 F10000                              # Go to starting point
    G1 X0.5 Y20 E20 F1000                                 # Primeline

[gcode_macro PRINT_END]
gcode:
    # Life Z relatively
    G91
    G1 Z25
    G90

    # Park the toolhead
    G1 X124 Y175 Z2.25 F6000
    #G1 Y{printer.toolhead.axis_maximum.y} F6000

    # Filament retract to prevent oozing
    G92 E0                                      # Reset extruder position
    #G1 E-2 F1500                                # Retract 2 mm
    G1 E2 F500
    G1 Y185 F200

    # Turn off heaters and fans
    M104 S0                                     # Turn off hotend
    #M140 S0                                     # Turn off bed
    M107                                        # Turn off part cooling fan

    # Wait for hotend to cool.down, then move nozzle away from end stop.
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM=150
    G1 X114

    gradually_cool_down_bed
    # Trigger turning off carbon filter when chamber temp reaches room temp
    turn_off_fans_after_chamber_cools

    # Disable steppers (optional – remove if you want to keep motors locked)
    M84                                         # Disable motors
